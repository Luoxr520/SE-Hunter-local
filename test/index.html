<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘书名是个大帅比 ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    overflow: hidden;
    cursor: default;
  }

  canvas { position: fixed; top: 0; left: 0; z-index: 0; }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .main-text {
    font-size: 5rem;
    font-weight: 900;
    background: linear-gradient(90deg, #f12711, #f5af19, #00d2ff, #ff6ec7, #f12711);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s ease infinite;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sub-text {
    font-size: 2rem;
    color: #fff;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInUp 1.5s ease forwards 0.5s;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .emoji-rain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .emoji {
    position: absolute;
    font-size: 2rem;
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10vh) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }

  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    animation: sparkle 1.5s ease-in-out infinite;
  }

  @keyframes sparkle {
    0%, 100% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1); opacity: 1; }
  }

  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: pulse 2s ease-out infinite;
  }

  .pulse-ring:nth-child(2) { animation-delay: 0.5s; }
  .pulse-ring:nth-child(3) { animation-delay: 1.0s; }

  @keyframes pulse {
    0% { width: 200px; height: 200px; opacity: 0.8; }
    100% { width: 600px; height: 600px; opacity: 0; }
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 1.5s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="stars" id="stars"></div>
<div class="emoji-rain" id="emojiRain"></div>

<div class="content">
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <h1 class="main-text">刘书名是个大帅比</h1>
  <p class="sub-text">✨ 宇宙级帅气认证 ✨</p>
</div>

<script>
  // Background particles
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -10;
      this.size = Math.random() * 3 + 1;
      this.speedY = Math.random() * 2 + 0.5;
      this.speedX = Math.random() * 1 - 0.5;
      this.opacity = Math.random() * 0.8 + 0.2;
      this.hue = Math.random() * 360;
    }
    update() {
      this.y += this.speedY;
      this.x += this.speedX;
      if (this.y > canvas.height + 10) this.reset();
      if (this.x < 0) this.x = canvas.width;
      if (this.x > canvas.width) this.x = 0;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.opacity})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < 100; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();

  // Stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
    star.style.animationDelay = Math.random() * 2 + 's';
    star.style.animationDuration = Math.random() * 2 + 2 + 's';
    starsContainer.appendChild(star);
  }

  // Emoji rain
  const emojis = ['😎', '✨', '🌟', '💫', '🔥', '💯', '👑', '🎉', '❤️', '⭐', '💎', '🦁', '🌈', '🎸', '🏆'];
  const emojiRain = document.getElementById('emojiRain');

  setInterval(() => {
    const el = document.createElement('span');
    el.className = 'emoji';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.animationDuration = Math.random() * 4 + 3 + 's';
    el.style.fontSize = Math.random() * 2 + 1.2 + 'rem';
    emojiRain.appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }, 400);

  // Click sparkle
  document.addEventListener('click', (e) => {
    for (let i = 0; i < 12; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = e.clientX + 'px';
      sparkle.style.top = e.clientY + 'px';
      sparkle.style.transform = `translate(${Math.random() * 80 - 40}px, ${Math.random() * 80 - 40}px)`;
      sparkle.style.animationDuration = Math.random() * 1 + 0.8 + 's';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 2000);
    }
  });

  // 3D tilt effect on title
  const title = document.querySelector('.main-text');
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    title.style.transform = `perspective(500px) rotateY(${x}deg) rotateX(${-y}deg)`;
  });
</script>
</body>
</html>
