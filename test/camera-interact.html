<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>摄像头多模式交互</title>
<style>
  :root {
    --glass-bg: rgba(15, 15, 30, 0.75);
    --glass-border: rgba(255, 255, 255, 0.12);
    --accent: #00e5ff;
    --accent2: #ff4081;
    --text: #e0e0e0;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #000;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    height: 100vh; height: 100dvh;
    width: 100vw;
  }

  /* ── Video & Canvas layers ── */
  #videoContainer {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #videoContainer.mirror video,
  #videoContainer.mirror canvas { transform: scaleX(-1); }

  video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 1;
  }

  #overlay {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0a0a1a;
    color: #fff;
    transition: opacity 0.5s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loading .step { font-size: 0.95rem; color: #aaa; margin-top: 8px; }
  #loading .step.done { color: #4caf50; }
  #loading .step.active { color: var(--accent); }

  #errorMsg {
    display: none; position: fixed; inset: 0; z-index: 200;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); color: #ff5252;
    font-size: 1.1rem; text-align: center; padding: 20px;
    flex-direction: column; gap: 16px;
  }
  #errorMsg button {
    padding: 10px 24px; border: none; border-radius: 8px;
    background: var(--accent); color: #000; cursor: pointer; font-size: 1rem;
  }

  /* ── UI panel ── */
  #panel {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
    min-width: 180px;
    transition: opacity 0.3s;
  }
  #panel.hidden { opacity: 0; pointer-events: none; }

  #panel .title {
    color: #fff; font-size: 0.9rem; font-weight: 700;
    letter-spacing: 0.04em; margin-bottom: 4px;
  }

  #panel button {
    display: block; width: 100%;
    padding: 9px 12px; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; background: rgba(255,255,255,0.06);
    color: #ccc; cursor: pointer; font-size: 0.85rem;
    text-align: left; transition: all 0.2s;
    font-family: inherit;
  }
  #panel button:hover { background: rgba(255,255,255,0.14); color: #fff; }
  #panel button.active {
    background: rgba(0,229,255,0.18); border-color: var(--accent);
    color: var(--accent); font-weight: 600;
  }

  #panel .divider { height: 1px; background: var(--glass-border); margin: 4px 0; }

  label.toggle {
    display: flex; align-items: center; gap: 8px;
    color: #ccc; font-size: 0.8rem; cursor: pointer;
  }
  label.toggle input { accent-color: var(--accent); }

  /* ── Gesture badge ── */
  #gestureBadge {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 40px; padding: 10px 28px;
    color: #fff; font-size: 1.5rem; font-weight: 700;
    letter-spacing: 0.04em;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: all 0.2s;
    opacity: 0;
  }
  #gestureBadge.visible { opacity: 1; }

  /* ── FPS ── */
  #fps {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    color: rgba(255,255,255,0.6); font-size: 0.75rem;
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  }
  #debug {
    position: fixed; top: 44px; right: 20px; z-index: 10;
    color: rgba(255,255,255,0.55); font-size: 0.7rem;
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    line-height: 1.5;
    pointer-events: none;
  }

  /* Mobile tweaks */
  @media (max-width: 768px) {
    #panel { top: auto; bottom: 100px; left: 8px; padding: 10px 12px; min-width: 150px; border-radius: 12px; }
    #panel button { padding: 7px 10px; font-size: 0.78rem; }
    #gestureBadge { bottom: 20px; font-size: 1.2rem; padding: 8px 20px; }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <div style="font-weight:700;font-size:1.2rem;">正在加载</div>
  <div class="step" id="loadCamera">⏳ 摄像头...</div>
  <div class="step" id="loadWasm">⏳ WASM 运行时...</div>
  <div class="step" id="loadHands">⏳ 手势模型...</div>
  <div class="step" id="loadFace">⏳ 人脸模型...</div>
  <div class="step" id="loadPose">⏳ 姿态模型...</div>
</div>

<!-- Error -->
<div id="errorMsg">
  <div id="errorText"></div>
  <button onclick="location.reload()">重试</button>
</div>

<!-- Video -->
<div id="videoContainer" class="mirror">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
</div>

<!-- UI Panel -->
<div id="panel">
  <div class="title">🎮 交互模式</div>
  <button data-mode="all" class="active">🌟 综合模式</button>
  <button data-mode="hands">✋ 手势控制</button>
  <button data-mode="face">😎 人脸 AR</button>
  <button data-mode="pose">🕺 体态识别</button>
  <button data-mode="motion">💨 动作检测</button>
  <div class="divider"></div>
  <label class="toggle"><input type="checkbox" id="toggleMirror" checked> 镜像画面</label>
  <label class="toggle"><input type="checkbox" id="toggleMesh"> 面部网格</label>
</div>

<!-- Gesture -->
<div id="gestureBadge"></div>

<!-- FPS -->
<div id="fps">FPS: --</div>
<div id="debug"></div>

<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm"
  }
}
</script>

<script type="module">
import { HandLandmarker, FaceLandmarker, PoseLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

// ── DOM refs ──
const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx     = overlay.getContext('2d');
const panel   = document.getElementById('panel');
const gestureBadge = document.getElementById('gestureBadge');
const fpsEl   = document.getElementById('fps');
const loadingEl = document.getElementById('loading');
const errorEl  = document.getElementById('errorMsg');
const errorText = document.getElementById('errorText');
const videoContainer = document.getElementById('videoContainer');

// ── State ──
const STATE = {
  mode: 'all',          // all | hands | face | pose | motion
  mirror: true,
  showMesh: true,
  ready: false,
  frameCount: 0,
  fps: 0,
  lastFpsTime: performance.now(),
  // detection results
  handResult: null,
  faceResult: null,
  poseResult: null,
  gesture: '',
  motionLevel: 0,
  // previous frame for motion detection
  prevFrame: null,
  // particles
  particles: [],
  gestureDebounce: 0,
  // model frame counters for throttling
  handFrameSkip: 2,
  faceFrameSkip: 1,
  poseFrameSkip: 0,
};

// ── Helpers ──
function showError(msg) {
  errorText.textContent = msg;
  errorEl.style.display = 'flex';
  loadingEl.classList.add('hidden');
}

function setStep(id, text, status) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'step ' + status;
}

function lerp(a, b, t) { return a + (b - a) * t; }

// ── Camera ──
async function initCamera() {
  setStep('loadCamera', '⏳ 请求摄像头权限...', 'active');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    // Wait for video dimensions
    await new Promise(r => {
      if (video.videoWidth > 0) r();
      else video.addEventListener('loadedmetadata', r, { once: true });
    });
    resizeCanvas();
    setStep('loadCamera', '✅ 摄像头就绪', 'done');
  } catch (e) {
    setStep('loadCamera', '❌ 摄像头失败', 'done');
    showError('无法访问摄像头：' + (e.message || '权限被拒绝'));
    throw e;
  }
}

function resizeCanvas() {
  const w = video.videoWidth  || 1280;
  const h = video.videoHeight || 720;
  overlay.width  = w;
  overlay.height = h;
  overlay.style.width  = '100%';
  overlay.style.height = '100%';
}

// ── MediaPipe Init ──
let handLandmarker = null;
let faceLandmarker = null;
let poseLandmarker = null;

async function initMediaPipe() {
  setStep('loadWasm', '⏳ 下载 WASM 运行时...', 'active');
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
  );
  setStep('loadWasm', '✅ WASM 就绪', 'done');

  // Load all 3 in parallel
  const loadHand = (async () => {
    setStep('loadHands', '⏳ 下载手势模型 (≈5MB)...', 'active');
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
        delegate: 'CPU',
      },
      runningMode: 'VIDEO',
      numHands: 2,
    });
    setStep('loadHands', '✅ 手势模型就绪', 'done');
  })();

  const loadFace = (async () => {
    setStep('loadFace', '⏳ 下载人脸模型 (≈10MB)...', 'active');
    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task',
        delegate: 'CPU',
      },
      runningMode: 'VIDEO',
      numFaces: 2,
      outputFaceBlendshapes: true,
    });
    setStep('loadFace', '✅ 人脸模型就绪', 'done');
  })();

  const loadPose = (async () => {
    setStep('loadPose', '⏳ 下载姿态模型 (≈8MB)...', 'active');
    // GPU delegate often hangs on pose model — use CPU for reliability
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker/float16/latest/pose_landmarker.task',
        delegate: 'CPU',
      },
      runningMode: 'VIDEO',
      numPoses: 2,
    });
    setStep('loadPose', '✅ 姿态模型就绪', 'done');
  })();

  const results = await Promise.allSettled([loadHand, loadFace, loadPose]);
  if (results[0].status === 'rejected') setStep('loadHands', '⚠️ 手势模型失败', 'done');
  if (results[1].status === 'rejected') setStep('loadFace', '⚠️ 人脸模型失败', 'done');
  if (results[2].status === 'rejected') setStep('loadPose', '⚠️ 姿态模型失败', 'done');
}

// ── Gesture Classification ──
function isFingerExtended(lm, tipIdx, pipIdx, wristIdx) {
  // Compare distance from tip-to-wrist vs pip-to-wrist
  const tipDist = Math.hypot(lm[tipIdx].x - lm[wristIdx].x, lm[tipIdx].y - lm[wristIdx].y);
  const pipDist = Math.hypot(lm[pipIdx].x - lm[wristIdx].x, lm[pipIdx].y - lm[wristIdx].y);
  return tipDist > pipDist * 1.05;
}

function classifyGesture(landmarks) {
  if (!landmarks || landmarks.length < 21) return '';
  const lm = landmarks[0]; // first hand

  const thumbUp  = isFingerExtended(lm, 4, 3, 0);
  const indexUp  = isFingerExtended(lm, 8, 6, 0);
  const middleUp = isFingerExtended(lm, 12, 10, 0);
  const ringUp   = isFingerExtended(lm, 16, 14, 0);
  const pinkyUp  = isFingerExtended(lm, 20, 18, 0);

  const extended = [thumbUp, indexUp, middleUp, ringUp, pinkyUp];
  const count = extended.filter(Boolean).length;

  // OK sign: thumb tip close to index tip
  const thumbTip = lm[4], indexTip = lm[8];
  const thumbIndexDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
  if (thumbIndexDist < 0.05 && middleUp && ringUp && pinkyUp) return '👌 OK';

  if (count === 5) return '✋ 张开手掌';
  if (count === 0) return '✊ 握拳';
  if (indexUp && middleUp && !ringUp && !pinkyUp) return '✌️ 胜利';
  if (thumbUp && !indexUp && !middleUp && !ringUp && !pinkyUp) return '👍 赞';
  if (indexUp && !middleUp && !ringUp && !pinkyUp) return '👆 指向';
  if (indexUp && !middleUp && !ringUp && pinkyUp) return '🤘 摇滚';

  return count >= 4 ? '🖐 半张' : '';
}

// ── Drawing: Hand ──
const HAND_COLORS = ['#00e5ff', '#ff4081'];

function drawHands(result) {
  if (!result || !result.landmarks) return;
  result.landmarks.forEach((landmarks, i) => {
    const color = HAND_COLORS[i] || '#fff';
    // Connections
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    HandLandmarker.HAND_CONNECTIONS.forEach(([a, b]) => {
      const p = landmarks[a]; const q = landmarks[b];
      ctx.beginPath();
      ctx.moveTo(p.x * overlay.width, p.y * overlay.height);
      ctx.lineTo(q.x * overlay.width, q.y * overlay.height);
      ctx.stroke();
    });
    // Joints
    landmarks.forEach((lm, j) => {
      const x = lm.x * overlay.width, y = lm.y * overlay.height;
      ctx.beginPath();
      ctx.arc(x, y, j === 0 ? 6 : 4, 0, Math.PI * 2);
      ctx.fillStyle = j === 0 ? '#fff' : color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  });
}

// ── Drawing: Face Mesh ──
function drawFaceMesh(result) {
  if (!result || !result.faceLandmarks) return;
  const connections = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
  if (!connections) return;

  result.faceLandmarks.forEach((landmarks) => {
    if (!landmarks) return;
    // Mesh triangles
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.15)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    connections.forEach(([a, b]) => {
      const p = landmarks[a]; const q = landmarks[b];
      ctx.moveTo(p.x * overlay.width, p.y * overlay.height);
      ctx.lineTo(q.x * overlay.width, q.y * overlay.height);
    });
    ctx.stroke();

    // Contour highlights
    const contours = FaceLandmarker.FACE_LANDMARKS_CONTOURS;
    if (contours) {
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.5)';
      ctx.lineWidth = 1.5;
      contours.forEach(([a, b]) => {
        const p = landmarks[a]; const q = landmarks[b];
        ctx.beginPath();
        ctx.moveTo(p.x * overlay.width, p.y * overlay.height);
        ctx.lineTo(q.x * overlay.width, q.y * overlay.height);
        ctx.stroke();
      });
    }
  });
}

// ── Drawing: Face AR ──
function drawFaceAR(result, time) {
  if (!result || !result.faceLandmarks) return;
  result.faceLandmarks.forEach((landmarks) => {
    if (!landmarks) return;
    // Key landmarks (approximate, 478-model)
    const nose       = landmarks[1];
    const leftEyeIn  = landmarks[133];
    const leftEyeOut = landmarks[33];
    const rightEyeIn = landmarks[362];
    const rightEyeOut = landmarks[263];
    const forehead   = landmarks[10];
    const leftTemple = landmarks[234];
    const rightTemple = landmarks[454];
    const mouthLeft  = landmarks[61];
    const mouthRight = landmarks[291];
    const mouthTop   = landmarks[13];
    const mouthBottom = landmarks[14];

    const x = (p) => p.x * overlay.width;
    const y = (p) => p.y * overlay.height;

    const leftEyeCX  = (x(leftEyeIn) + x(leftEyeOut)) / 2;
    const leftEyeCY  = (y(leftEyeIn) + y(leftEyeOut)) / 2;
    const rightEyeCX = (x(rightEyeIn) + x(rightEyeOut)) / 2;
    const rightEyeCY = (y(rightEyeIn) + y(rightEyeOut)) / 2;
    const eyeDist    = Math.abs(x(rightEyeIn) - x(leftEyeIn));
    const lensW      = eyeDist * 0.55;
    const lensH      = lensW * 0.55;
    const bridgeX    = (leftEyeCX + rightEyeCX) / 2;
    const bridgeY    = (leftEyeCY + rightEyeCY) / 2;

    // ── Sunglasses ──
    ctx.save();
    // Gradient lenses
    [ {cx: leftEyeCX, cy: leftEyeCY}, {cx: rightEyeCX, cy: rightEyeCY} ].forEach(({cx, cy}) => {
      const grad = ctx.createLinearGradient(cx - lensW, cy - lensH, cx + lensW, cy + lensH);
      grad.addColorStop(0, 'rgba(0, 200, 255, 0.6)');
      grad.addColorStop(0.5, 'rgba(100, 50, 255, 0.7)');
      grad.addColorStop(1, 'rgba(255, 0, 128, 0.5)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, lensW, lensH, 0, 0, Math.PI * 2);
      ctx.fill();
      // Frame
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.ellipse(cx - lensW * 0.2, cy - lensH * 0.2, lensW * 0.25, lensH * 0.2, -0.4, 0, Math.PI * 2);
      ctx.fill();
    });
    // Bridge
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(leftEyeCX + lensW, leftEyeCY);
    ctx.quadraticCurveTo(bridgeX, bridgeY - lensH * 0.5, rightEyeCX - lensW, rightEyeCY);
    ctx.stroke();
    // Arms
    [ {fromX: leftEyeCX - lensW, fromY: leftEyeCY, toX: x(leftTemple), toY: y(leftTemple)},
      {fromX: rightEyeCX + lensW, fromY: rightEyeCY, toX: x(rightTemple), toY: y(rightTemple)} ]
      .forEach(({fromX, fromY, toX, toY}) => {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.stroke();
      });
    ctx.restore();

    // ── Crown ──
    const crownCX = x(forehead);
    const crownCY = y(forehead) - eyeDist * 0.3;
    const crownW = eyeDist * 0.9;
    const crownH = eyeDist * 0.6;
    const t = time * 0.002;

    ctx.save();
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(crownCX - crownW, crownCY);
    for (let i = 0; i < 7; i++) {
      const px = crownCX - crownW + (crownW * 2 * i) / 6;
      const py = crownCY + (i % 2 === 0 ? -crownH : -crownH * 0.3);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(crownCX + crownW, crownCY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Gems on crown
    for (let i = 0; i < 7; i++) {
      const gx = crownCX - crownW + (crownW * 2 * i) / 6;
      const gy = crownCY + (i % 2 === 0 ? -crownH : -crownH * 0.3);
      ctx.fillStyle = i % 2 === 0 ? '#ff4081' : '#00e5ff';
      ctx.beginPath();
      ctx.arc(gx, gy, 4 + Math.sin(t + i) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // ── Cheek sparkles ──
    const sparklePts = [
      { lx: x(mouthLeft) - 20, ly: y(mouthLeft) - 10 },
      { lx: x(mouthRight) + 20, ly: y(mouthRight) - 10 },
    ];
    sparklePts.forEach(({lx, ly}) => {
      for (let i = 0; i < 3; i++) {
        const angle = (t * 3 + i * Math.PI * 2 / 3) % (Math.PI * 2);
        const sr = 12 + Math.sin(t * 5 + i) * 5;
        const sx = lx + Math.cos(angle) * sr * 1.5;
        const sy = ly + Math.sin(angle) * sr;
        ctx.fillStyle = `rgba(255,255,255,${0.6 + Math.sin(t + i) * 0.4})`;
        drawSparkle(sx, sy, 3);
      }
    });
  });
}

function drawSparkle(x, y, size) {
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = (i * Math.PI) / 2;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * size * 2, y + Math.sin(a) * size * 2);
    const midA = a + Math.PI / 4;
    ctx.lineTo(x + Math.cos(midA) * size, y + Math.sin(midA) * size);
    ctx.closePath();
  }
  ctx.fill();
}

// ── Drawing: Pose ──
function drawPose(result) {
  if (!result || !result.landmarks) return;
  result.landmarks.forEach((landmarks) => {
    if (!landmarks) return;
    const conns = PoseLandmarker.POSE_CONNECTIONS;
    // Connections
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    conns.forEach(([a, b]) => {
      const p = landmarks[a]; const q = landmarks[b];
      if (p.visibility < 0.5 || q.visibility < 0.5) return;
      ctx.beginPath();
      ctx.moveTo(p.x * overlay.width, p.y * overlay.height);
      ctx.lineTo(q.x * overlay.width, q.y * overlay.height);
      ctx.stroke();
    });
    // Joints
    landmarks.forEach((lm) => {
      if (lm.visibility < 0.5) return;
      const x = lm.x * overlay.width, y = lm.y * overlay.height;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD700';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  });
}

// ── Motion Detection ──
let _motionCanvas = null, _motionCtx = null, _motionSw = 0, _motionSh = 0;
function detectMotion() {
  const scale = 0.2;
  const sw = Math.floor(overlay.width * scale), sh = Math.floor(overlay.height * scale);
  // Reuse canvas across frames
  if (!_motionCanvas || _motionSw !== sw || _motionSh !== sh) {
    _motionCanvas = document.createElement('canvas');
    _motionCanvas.width = sw; _motionCanvas.height = sh;
    _motionCtx = _motionCanvas.getContext('2d', { willReadFrequently: true });
    _motionSw = sw; _motionSh = sh;
  }
  _motionCtx.drawImage(video, 0, 0, sw, sh);
  const curr = _motionCtx.getImageData(0, 0, sw, sh);

  if (!STATE.prevFrame) { STATE.prevFrame = curr; return 0; }

  let diffSum = 0;
  const prev = STATE.prevFrame.data;
  const data = curr.data;
  const len = data.length;
  for (let i = 0; i < len; i += 4) {
    diffSum += Math.abs(data[i] - prev[i])
            + Math.abs(data[i+1] - prev[i+1])
            + Math.abs(data[i+2] - prev[i+2]);
  }
  STATE.prevFrame = curr;
  return diffSum / (len / 4 * 3);
}

// ── Particles ──
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.15; // gravity
    this.life--;
  }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.fillStyle = this.color.replace('1)', `${alpha})`).replace('rgb', 'rgba');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  get dead() { return this.life <= 0; }
}

function spawnMotionParticles(level) {
  if (level < 5) return;
  const count = Math.floor(level * 2);
  const w = overlay.width, h = overlay.height;
  for (let i = 0; i < count; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const vx = (Math.random() - 0.5) * 3;
    const vy = (Math.random() - 0.5) * 3 - 2;
    const life = 20 + Math.random() * 30;
    const hue = Math.floor(Math.random() * 360);
    STATE.particles.push(new Particle(x, y, vx, vy, life, `rgb(${hue},200,255)`, 2 + Math.random() * 4));
  }
}

function updateAndDrawParticles() {
  STATE.particles = STATE.particles.filter(p => { p.update(); return !p.dead; });
  STATE.particles.forEach(p => p.draw(ctx));
}

// ── Main Loop ──
function mainLoop() {
  if (!STATE.ready) { requestAnimationFrame(mainLoop); return; }
  const time = performance.now();
  STATE.frameCount++;

  // FPS
  if (time - STATE.lastFpsTime >= 1000) {
    STATE.fps = Math.round(STATE.fps * 0.3 + STATE.frameCount * 0.7);
    STATE.frameCount = 0;
    STATE.lastFpsTime = time;
    fpsEl.textContent = `FPS: ${STATE.fps}`;
  }

  // Debug panel (every 15 frames)
  if (STATE.frameCount % 15 === 0) {
    const dbg = document.getElementById('debug');
    if (dbg) {
      const hr = STATE.handResult ? (STATE.handResult.landmarks ? STATE.handResult.landmarks.length : 0) : 0;
      const fr = STATE.faceResult ? (STATE.faceResult.faceLandmarks ? STATE.faceResult.faceLandmarks.length : 0) : 0;
      const pr = STATE.poseResult ? (STATE.poseResult.landmarks ? STATE.poseResult.landmarks.length : 0) : 0;
      const vOk = video.videoWidth > 0 && !video.paused;
      dbg.textContent = 'vid:' + (vOk ? 'OK' : 'NO') + ' hands:' + hr + ' faces:' + fr + ' poses:' + pr + ' skip:' + STATE.handFrameSkip + '/' + STATE.faceFrameSkip + '/' + STATE.poseFrameSkip;
    }
  }

  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const mode = STATE.mode;
  const doHands  = mode === 'all' || mode === 'hands';
  const doFace   = mode === 'all' || mode === 'face';
  const doPose   = mode === 'all' || mode === 'pose';
  const doMotion = mode === 'all' || mode === 'motion';

  // Run detectors with staggered scheduling to avoid frame spikes
  // In 'all' mode: hands on frames 0,3,6...  face on 1,4,7...  pose on 2,5,8...
  if (doHands) {
    STATE.handFrameSkip++;
    const interval = mode === 'all' ? 3 : 1;
    if (STATE.handFrameSkip >= interval && handLandmarker) {
      STATE.handFrameSkip = 0;
      try { STATE.handResult = handLandmarker.detectForVideo(video, time); }
      catch (e) { console.warn('hand detect error:', e); }
    }
  } else { STATE.handResult = null; }

  if (doFace) {
    STATE.faceFrameSkip++;
    const interval = mode === 'all' ? 3 : 1;
    if (STATE.faceFrameSkip >= interval && faceLandmarker) {
      STATE.faceFrameSkip = 0;
      try { STATE.faceResult = faceLandmarker.detectForVideo(video, time); }
      catch (e) { console.warn('face detect error:', e); }
    }
  } else { STATE.faceResult = null; }

  if (doPose) {
    STATE.poseFrameSkip++;
    const interval = mode === 'all' ? 3 : 1;
    if (STATE.poseFrameSkip >= interval && poseLandmarker) {
      STATE.poseFrameSkip = 0;
      try { STATE.poseResult = poseLandmarker.detectForVideo(video, time); }
      catch (e) { console.warn('pose detect error:', e); }
    }
  } else { STATE.poseResult = null; }

    // Decrement gesture debounce counter
  if (STATE.gestureDebounce > 0) STATE.gestureDebounce--;

  // Motion detection (cheap, run every frame when active)
  if (doMotion) {
    STATE.motionLevel = detectMotion();
    spawnMotionParticles(STATE.motionLevel);
  } else {
    STATE.motionLevel = 0;
  }

  // ── Render ──
  // Pose (under everything)
  if (doPose && STATE.poseResult) drawPose(STATE.poseResult);

  // Face mesh (under AR)
  if (doFace && STATE.showMesh && STATE.faceResult) drawFaceMesh(STATE.faceResult);

  // Face AR (always when face mode active)
  if (doFace && STATE.faceResult) drawFaceAR(STATE.faceResult, time);

  // Hands
  if (doHands && STATE.handResult) {
    drawHands(STATE.handResult);
    // Gesture
    const g = classifyGesture(STATE.handResult.landmarks);
    const prevG = STATE.gesture;
    STATE.gesture = g;
    if (g) {
      gestureBadge.textContent = g;
      gestureBadge.classList.add('visible');
      // Debounce: only fire burst when gesture changes or every 30 frames
      if (g !== prevG || STATE.gestureDebounce <= 0) {
        if (g === '✊ 握拳') spawnBurst(() => true, 8, 'rgba(255,80,80,1)');
        if (g === '✋ 张开手掌') spawnBurst(() => true, 15, 'rgba(0,229,255,1)');
        if (g === '👍 赞') spawnBurst(() => true, 5, 'rgba(255,215,0,1)');
        STATE.gestureDebounce = 25;
      }
    } else {
      gestureBadge.classList.remove('visible');
    }
  } else if (mode !== 'hands' || !doHands) {
    gestureBadge.classList.remove('visible');
  }

  // Motion particles (on top)
  updateAndDrawParticles();

  // Motion glow
  if (doMotion && STATE.motionLevel > 8) {
    const alpha = Math.min(STATE.motionLevel / 50, 0.3);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(0, 0, overlay.width, overlay.height);
  }

  requestAnimationFrame(mainLoop);
}

function spawnBurst(/* filter fn */ filter, count, color) {
  if (STATE.particles.length > 200) return; // limit
  const w = overlay.width, h = overlay.height;
  for (let i = 0; i < count; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const vx = (Math.random() - 0.5) * 8;
    const vy = (Math.random() - 0.5) * 8 - 3;
    STATE.particles.push(new Particle(x, y, vx, vy, 25 + Math.random() * 20, color, 3 + Math.random() * 5));
  }
}

// ── UI Handlers ──
panel.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  panel.querySelectorAll('button[data-mode]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  STATE.mode = btn.dataset.mode;
  // Clear particles on mode switch
  STATE.particles = [];
  STATE.handResult = null;
  STATE.faceResult = null;
  STATE.poseResult = null;
});

document.getElementById('toggleMirror').addEventListener('change', (e) => {
  STATE.mirror = e.target.checked;
  if (STATE.mirror) videoContainer.classList.add('mirror');
  else videoContainer.classList.remove('mirror');
});

document.getElementById('toggleMesh').addEventListener('change', (e) => {
  STATE.showMesh = e.target.checked;
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  const keys = { '1': 'all', '2': 'hands', '3': 'face', '4': 'pose', '5': 'motion' };
  const mode = keys[e.key];
  if (mode) {
    panel.querySelectorAll('button[data-mode]').forEach(b => b.classList.remove('active'));
    const btn = panel.querySelector(`button[data-mode="${mode}"]`);
    if (btn) btn.classList.add('active');
    STATE.mode = mode;
    STATE.particles = [];
  }
  if (e.key === 'm') {
    STATE.mirror = !STATE.mirror;
    document.getElementById('toggleMirror').checked = STATE.mirror;
    if (STATE.mirror) videoContainer.classList.add('mirror');
    else videoContainer.classList.remove('mirror');
  }
});

// ── Bootstrap ──
async function init() {
  try {
    await initCamera();
    await initMediaPipe();
    loadingEl.classList.add('hidden');
    STATE.ready = true;
    console.log('All models loaded. Hands:', !!handLandmarker, 'Face:', !!faceLandmarker, 'Pose:', !!poseLandmarker);
    console.log('Video ready:', video.videoWidth, 'x', video.videoHeight, 'paused:', video.paused);
    requestAnimationFrame(mainLoop);
  } catch (e) {
    if (errorEl.style.display !== 'flex') {
      console.error(e);
    }
  }
}

init();
</script>
